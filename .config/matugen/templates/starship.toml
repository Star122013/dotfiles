# Generated by Matugen

add_newline = true
palette = "matugen"

format = """
[╭─](green)\
$os\
$directory\
$nix_shell\
$python\
$nodejs\
$rust\
$golang\
$git_branch\
$git_status\
$line_break\
$character"""

[palettes.matugen]
rosewater = '{{colors.on_surface.default.hex}}'
flamingo  = '{{colors.primary.default.hex}}'
pink      = '{{colors.tertiary.default.hex}}'
mauve     = '{{colors.tertiary.default.hex}}'
red       = '{{colors.error.default.hex}}'
maroon    = '{{colors.error_container.default.hex}}'
peach     = '{{colors.tertiary_container.default.hex}}'
yellow    = '{{colors.secondary_container.default.hex}}'
green     = '{{colors.primary.default.hex}}'
teal      = '{{colors.secondary.default.hex}}'
sky       = '{{colors.secondary.default.hex}}'
sapphire  = '{{colors.secondary.default.hex}}'
blue      = '{{colors.primary.default.hex}}'
lavender  = '{{colors.on_primary_container.default.hex}}'
text      = '{{colors.on_surface.default.hex}}'
subtext1  = '{{colors.on_surface_variant.default.hex}}'
subtext0  = '{{colors.outline.default.hex}}'
overlay2  = '{{colors.outline_variant.default.hex}}'
overlay1  = '{{colors.surface_variant.default.hex}}'
overlay0  = '{{colors.surface_container_highest.default.hex}}'
crust     = '{{colors.surface_container_lowest.default.hex}}'
mantle    = '{{colors.surface_container_low.default.hex}}'
base      = '{{colors.surface.default.hex}}'
surface0  = '{{colors.surface_container.default.hex}}'
surface1  = '{{colors.surface_container_high.default.hex}}'
surface2  = '{{colors.surface_container_highest.default.hex}}'

[os]
disabled = false
style = "bold sapphire"
format = "[$symbol]($style)"

[os.symbols]
NixOS = " "
Windows = " "
Ubuntu = " "
Macos = " "
Linux = " "
Arch = " "

[directory]
style = "bold blue"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[python]
style = "bold lavender"
symbol = " "
format = '[ via ](overlay0)[${symbol}${version}]($style)'
version_format = "v${raw}"

[nix_shell]
symbol = " "
style = "bold sapphire"
format = '[ via ](overlay0)[$symbol$state]($style)'
impure_msg = "(impure)"
pure_msg = "(pure)"

[nodejs]
style = "bold green"
format = '[ via ](overlay0)[${symbol}${version}]($style)'
symbol = " "

[rust]
style = "bold red"
format = '[ via ](overlay0)[${symbol}${version}]($style)'
symbol = " "

[git_branch]
symbol = " "
style = "mauve"
format = '[ on ](overlay0)[$symbol$branch]($style)'

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style))'

[character]
success_symbol = "[╰─](bold green)"
error_symbol = "[╰─](bold red)"
vimcmd_symbol = "[╰─ ❮](green)"
