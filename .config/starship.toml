# Generated by Matugen

add_newline = true
palette = "catppuccin_mocha"

format = """
[╭─](green)\
$os\
$directory\
$nix_shell\
$python\
$nodejs\
$rust\
$golang\
$git_branch\
$git_status\
$line_break\
$character"""

