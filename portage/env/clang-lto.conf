# /etc/portage/env/clang-thinlto

# 强制使用 Clang 编译器
CC="clang"
CXX="clang++"

# 使用 llvm 的工具链，防止 binutils 处理不了 LTO 的中间代码
AR="llvm-ar"
NM="llvm-nm"
RANLIB="llvm-ranlib"

# 核心 LTO 参数
# -flto=thin: 推荐用于 Clang，比 Full LTO 编译快得多，内存占用少，性能差异极小
# -fuse-ld=lld: 强烈建议配合 lld 链接器使用，ld.bfd 配合 Clang LTO 经常出问题
CFLAGS="${CFLAGS} -O3 -flto=thin -fuse-ld=lld"
CXXFLAGS="${CXXFLAGS} -O3 -flto=thin -fuse-ld=lld"
LDFLAGS="${LDFLAGS} -O3 -flto=thin -fuse-ld=lld"
