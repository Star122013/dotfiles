<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <match target="pattern">
  <test name="family" qual="first">
   <string>sans-serif</string>
  </test>
  <!-- Replace generic family so later system prepend rules won't re-match -->
  <edit binding="strong" mode="assign_replace" name="family">
   <string>Maple Mono NF CN</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="first">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="assign_replace" name="family">
   <string>Maple Mono NF CN</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="first">
   <string>monospace</string>
  </test>
  <edit binding="strong" mode="assign_replace" name="family">
   <string>Maple Mono NF CN</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="first">
   <string>emoji</string>
  </test>
  <edit binding="strong" mode="assign_replace" name="family">
   <string>Noto Color Emoji</string>
  </edit>
 </match>
