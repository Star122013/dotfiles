regular2=56949f     # green (Foam)
regular3=ea9d34     # yellow (Gold)
regular4=286983     # blue (Pine)
regular5=907aa9     # magenta (Iris)
regular6=d7827e     # cyan (Rose)
regular7=575279     # white (Text)

# bright colors (color palette 40-47)
bright0=bfb6ae      # bright black (darker Overlay)
bright1=813047      # bright red (darker Love)
bright2=23616c      # bright green (darker Foam)
bright3=b76a01      # bright yellow (darker Gold)
bright4=003650      # bright blue (darker Pine)
bright5=5d4776      # bright magenta (darker Iris)
bright6=a44f4b      # bright cyan (darker Rose)
