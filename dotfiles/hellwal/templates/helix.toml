# =============================================================================
# Helix theme — generated by matugen
# Uses Material You color palette (colors.primary/secondary/tertiary/surface/etc)
# Inspired by catppuccin's design: rich layers, vibrant accents, high contrast.
#
# Palette roles (catppuccin-style → Material You mapping):
#   crust/mantle/base       → surface hierarchy (darkest → main bg)
#   surface0/1              → surface_container hierarchy
#   overlay0/1/2            → outline / outline_variant
#   subtext0/text           → on_surface_variant / on_surface
#   blue/sapphire/lavender  → primary family
#   mauve/pink              → secondary family
#   green/teal/sky          → tertiary family
#   red/maroon              → error family
#   yellow/peach/rosewater  → container colors
# =============================================================================

# --- Syntax Highlighting ----------------------------------------------------

"attribute"                                      = "yellow"
"type"                                           = "yellow"
"type.builtin"                                   = { fg = "peach", modifiers = ["bold"] }
"type.enum"                                      = { fg = "teal", modifiers = ["bold"] }
"type.enum.variant"                              = "teal"

"constructor"                                    = "sapphire"

"constant"                                       = "peach"
"constant.builtin"                               = { fg = "peach", modifiers = ["bold"] }
"constant.character"                             = "teal"
"constant.character.escape"                      = "pink"
"constant.numeric"                               = { fg = "peach", modifiers = ["bold"] }

"string"                                         = "green"
"string.regexp"                                  = "pink"
"string.special"                                 = "blue"
"string.special.path"                            = "sky"
"string.special.symbol"                          = "red"
"string.special.url"                             = { fg = "blue", modifiers = ["italic", "underlined"] }

"comment"                                        = { fg = "overlay2", modifiers = ["italic"] }
"comment.line"                                   = { fg = "overlay2", modifiers = ["italic"] }
"comment.block"                                  = { fg = "overlay2", modifiers = ["italic"] }
"comment.documentation"                          = { fg = "subtext0", modifiers = ["italic"] }

"variable"                                       = "text"
"variable.parameter"                             = { fg = "maroon", modifiers = ["italic"] }
"variable.builtin"                               = "red"
"variable.other.member"                          = "blue"
"variable.type"                                  = { fg = "yellow", modifiers = ["italic"] }

"label"                                          = "sapphire"
"annotation"                                     = "mauve"

"punctuation"                                    = "overlay2"
"punctuation.delimiter"                          = "overlay1"
"punctuation.bracket"                            = "overlay2"
"punctuation.special"                            = "sky"

"keyword"                                        = "mauve"
"keyword.control"                                = "mauve"
"keyword.control.conditional"                    = { fg = "mauve", modifiers = ["italic"] }
"keyword.control.repeat"                         = { fg = "mauve", modifiers = ["italic"] }
"keyword.control.import"                         = { fg = "mauve", modifiers = ["bold"] }
"keyword.control.return"                         = { fg = "mauve", modifiers = ["bold"] }
"keyword.directive"                              = { fg = "mauve", modifiers = ["bold"] }
"keyword.directive.define"                       = { fg = "mauve", modifiers = ["bold"] }
"keyword.function"                               = { fg = "mauve", modifiers = ["bold"] }
"keyword.storage.modifier"                       = { fg = "blue", modifiers = ["italic"] }
"keyword.storage.modifier.mut"                   = { fg = "red", modifiers = ["bold"] }

"operator"                                       = "sky"
"operator.keyword"                               = { fg = "mauve", modifiers = ["bold"] }

"function"                                       = "blue"
"function.builtin"                               = { fg = "sapphire", modifiers = ["bold"] }
"function.macro"                                 = "mauve"
"function.method"                                = "blue"
"function.special"                               = { fg = "sapphire", modifiers = ["bold"] }

"tag"                                            = "blue"
"tag.attribute"                                  = "yellow"
"tag.delimiter"                                  = "overlay2"

"namespace"                                      = { fg = "yellow", modifiers = ["italic"] }

"special"                                        = "blue"

"markup.heading"                                 = { fg = "red", modifiers = ["bold"] }
"markup.heading.1"                               = "red"
"markup.heading.2"                               = "peach"
"markup.heading.3"                               = "yellow"
"markup.heading.4"                               = "green"
"markup.heading.5"                               = "sapphire"
"markup.heading.6"                               = "lavender"
"markup.list"                                    = "teal"
"markup.list.checked"                            = "green"
"markup.list.unchecked"                          = "overlay2"
"markup.bold"                                    = { fg = "red", modifiers = ["bold"] }
"markup.italic"                                  = { fg = "red", modifiers = ["italic"] }
"markup.strikethrough"                           = { fg = "overlay2", modifiers = ["crossed_out"] }
"markup.link.url"                                = { fg = "blue", modifiers = ["italic", "underlined"] }
"markup.link.text"                               = "lavender"
"markup.link.label"                              = "sapphire"
"markup.raw"                                     = "green"
"markup.raw.inline"                              = "green"
"markup.raw.block"                               = { fg = "green", bg = "mantle" }
"markup.quote"                                   = "pink"

"diff.plus"                                      = "green"
"diff.minus"                                     = "red"
"diff.delta"                                     = "blue"

# --- User Interface ----------------------------------------------------------

"ui.background"                                  = { fg = "text", bg = "base" }

"ui.linenr"                                      = { fg = "surface0" }
"ui.linenr.selected"                             = { fg = "lavender", modifiers = ["bold"] }
"ui.linenr.virtual"                              = { fg = "surface0", modifiers = ["dim"] }

"ui.statusline"                                  = { fg = "subtext1", bg = "mantle" }
"ui.statusline.inactive"                         = { fg = "surface0", bg = "mantle" }
"ui.statusline.normal"                           = { fg = "base", bg = "rosewater", modifiers = ["bold"] }
"ui.statusline.insert"                           = { fg = "base", bg = "green", modifiers = ["bold"] }
"ui.statusline.select"                           = { fg = "base", bg = "lavender", modifiers = ["bold"] }

"ui.popup"                                       = { fg = "text", bg = "surface0" }
"ui.window"                                      = { fg = "crust" }
"ui.help"                                        = { fg = "overlay2", bg = "surface0" }

"ui.bufferline"                                  = { fg = "subtext0", bg = "mantle" }
"ui.bufferline.active"                           = { fg = "mauve", bg = "base", underline = { color = "mauve", style = "line" } }
"ui.bufferline.background"                       = { bg = "crust" }

"ui.text"                                        = "text"
"ui.text.focus"                                  = { fg = "text", bg = "surface0", modifiers = ["bold"] }
"ui.text.inactive"                               = { fg = "overlay1" }
"ui.text.directory"                              = { fg = "blue" }

"ui.virtual"                                     = "overlay0"
"ui.virtual.ruler"                               = { bg = "surface0" }
"ui.virtual.indent-guide"                        = "surface0"
"ui.virtual.inlay-hint"                          = { fg = "surface0", bg = "mantle" }
"ui.virtual.jump-label"                          = { fg = "rosewater", modifiers = ["bold"] }
"ui.virtual.whitespace"                          = "surface0"

"ui.selection"                                   = { bg = "surface1" }
"ui.selection.primary"                           = { bg = "surface1" }

# --- Cursor (high contrast — see palette for color choices) ------------------

# Primary cursor: uses a light accent bg with dark fg (= main surface bg)
# so the cursor appears as a bright block with the character "cut out" in dark.
"ui.cursor"                                      = { fg = "base", bg = "secondary_cursor" }
"ui.cursor.primary"                              = { fg = "base", bg = "rosewater" }
"ui.cursor.match"                                = { fg = "peach", modifiers = ["bold"] }

# Mode-specific primary cursor colors
"ui.cursor.primary.normal"                       = { fg = "base", bg = "rosewater" }
"ui.cursor.primary.insert"                       = { fg = "base", bg = "green" }
"ui.cursor.primary.select"                       = { fg = "base", bg = "lavender" }

# Secondary (multi) cursor colors
"ui.cursor.normal"                               = { fg = "base", bg = "secondary_cursor_normal" }
"ui.cursor.insert"                               = { fg = "base", bg = "secondary_cursor_insert" }
"ui.cursor.select"                               = { fg = "base", bg = "secondary_cursor_select" }

"ui.cursorline.primary"                          = { bg = "cursorline" }
"ui.cursorcolumn.primary"                        = { bg = "cursorline" }

"ui.highlight"                                   = { bg = "surface1", modifiers = ["bold"] }
"ui.highlight.framebox"                          = { fg = "rosewater", bg = "surface0", modifiers = ["bold"] }

"ui.menu"                                        = { fg = "overlay2", bg = "surface0" }
"ui.menu.selected"                               = { fg = "text", bg = "surface1", modifiers = ["bold"] }
"ui.menu.scroll"                                 = { fg = "overlay2", bg = "surface0" }

# --- Diagnostics -------------------------------------------------------------

"diagnostic.error"                               = { underline = { color = "red", style = "curl" } }
"diagnostic.warning"                             = { underline = { color = "yellow", style = "curl" } }
"diagnostic.info"                                = { underline = { color = "sky", style = "curl" } }
"diagnostic.hint"                                = { underline = { color = "teal", style = "curl" } }
"diagnostic.unnecessary"                         = { modifiers = ["dim"] }
"diagnostic.deprecated"                          = { modifiers = ["crossed_out"] }

# --- Diagnostic severity colors (for glyphs/signs) ---------------------------

error                                            = "red"
warning                                          = "yellow"
info                                             = "sky"
hint                                             = "teal"

# --- Rainbow bracket colors --------------------------------------------------

rainbow                                          = ["red", "peach", "yellow", "green", "sapphire", "lavender"]

# =============================================================================
# Color Palette — Material You → catppuccin-inspired named colors
#
# matugen template syntax: {{ colors.<name>.<scheme>.<format> }}
#   - scheme: "default" (uses --mode from CLI), or "dark"/"light"
#   - format: "hex" → "#rrggbb" (with #)
#
# Surface hierarchy in Material You dark mode (darkest → lightest):
#   surface_dim → surface_container_lowest → surface_container_low
#   → surface → surface_container → surface_container_high
#   → surface_container_highest → surface_bright
# =============================================================================

[palette]

# --- Background layers (6 levels like catppuccin) ---------------------------
# crust → mantle → base → surface0 → surface1 → surface2

crust    = "{{ colors.surface_dim.default.hex }}"              # darkest bg
mantle   = "{{ colors.surface_container_low.default.hex }}"    # statusline/bufferline bg
base     = "{{ colors.surface.default.hex }}"                  # main editor bg

surface0 = "{{ colors.surface_container.default.hex }}"        # popups, menus, line numbers
surface1 = "{{ colors.surface_container_high.default.hex }}"   # selection, highlights
surface2 = "{{ colors.surface_container_highest.default.hex }}"# hover, focused items

# --- Overlay / muted text layers ---------------------------------------------

overlay2 = "{{ colors.outline.default.hex }}"                 # comments, muted text
overlay1 = "{{ colors.outline_variant.default.hex }}"         # inactive text, delimiters
overlay0 = "{{ colors.outline_variant.default.hex }}"         # virtual text, indent guides

# --- Text hierarchy ----------------------------------------------------------

text     = "{{ colors.on_surface.default.hex }}"              # primary text
subtext1 = "{{ colors.on_surface.default.hex }}"              # statusline text
subtext0 = "{{ colors.on_surface_variant.default.hex }}"      # bufferline, doc comments

# --- Primary family → blue tones ---------------------------------------------
# Material You primary is typically a blue / indigo hue from your wallpaper

blue     = "{{ colors.primary.default.hex }}"                  # functions, tags, links
sapphire = "{{ colors.primary_fixed.default.hex }}"            # constructors, labels, heading 5
lavender = "{{ colors.primary_fixed_dim.default.hex }}"        # selected line number, heading 6

# --- Secondary family → purple / mauve tones ---------------------------------
# Material You secondary is often a muted purple or warm gray

mauve    = "{{ colors.secondary.default.hex }}"                # keywords, macros, operators
pink     = "{{ colors.secondary_fixed.default.hex }}"          # escape chars, regexp, quotes

# --- Tertiary family → green / teal tones ------------------------------------
# Material You tertiary is typically green, teal, or warm earth tones

green    = "{{ colors.tertiary.default.hex }}"                 # strings, diff plus, raw
teal     = "{{ colors.tertiary_fixed_dim.default.hex }}"       # enum variants, lists
sky      = "{{ colors.tertiary_container.default.hex }}"       # operators, punctuation special

# --- Container colors → warm / soft tones ------------------------------------
# Containers are lighter/lower-saturation variants of the main accents

rosewater = "{{ colors.primary_container.default.hex }}"       # statusline normal, cursor primary
yellow   = "{{ colors.secondary_container.default.hex }}"      # types, attributes, headings 3
peach    = "{{ colors.tertiary_fixed.default.hex }}"           # constants, numeric, headings 2
flamingo = "{{ colors.tertiary_container.default.hex }}"       # (reserved)

# --- Error family → red tones ------------------------------------------------

red      = "{{ colors.error.default.hex }}"                    # errors, diff minus, builtin vars
maroon   = "{{ colors.error_container.default.hex }}"          # parameters, soft highlights

# --- Special colors (guaranteed high contrast) -------------------------------

# Cursor: fg = base (dark bg), bg = bright accent
# This creates a visible block cursor with the character "cut out" in dark.
cursor_color = "{{ colors.primary.default.hex }}"              # NOT directly used by Helix keys below

# Border / outline
border_color = "{{ colors.outline.default.hex }}"

# Cursor line highlight — subtly brighter than base
cursorline = "{{ colors.surface_container_lowest.default.hex }}"

# Secondary cursors (multi-cursor mode) — use tertiary & secondary for variety
secondary_cursor             = "{{ colors.tertiary_fixed_dim.default.hex }}"
secondary_cursor_normal      = "{{ colors.primary_fixed_dim.default.hex }}"
secondary_cursor_insert      = "{{ colors.tertiary.default.hex }}"
secondary_cursor_select      = "{{ colors.secondary_fixed_dim.default.hex }}"
