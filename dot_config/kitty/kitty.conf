include ./themes/noctalia.conf
# include ~/.cache/hellwal/kitty-colors.conf

# font
# font_family          Maple Mono NF CN 
# bold_font            Maple Mono NF CN Bold
# italic_font          Maple Mono NF CN Italic
# bold_italic_font     Maple Mono NF CN Bold Italic
# font_features        MapleMono-NF-CN-ExtraLight +cv01 +ss02 +ss04 +ss05 +zero
# font_features        MapleMono-NF-CN-Bold +cv01 +ss02 +ss04 +ss05 +zero
# font_features        MapleMono-NF-CN-Italic +cv01 +ss02 +ss04 +ss05 +zero
# font_features        MapleMono-NF-CN-BoldItalic +cv01 +ss02 +ss04 +ss05 +zero
font_size 14

shell nu

# tab
tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# background
background_opacity 0.9

# cursor
cursor_shape underline
cursor_underline_thickness 2.0
cursor_trail 3

# IME
wayland_enable_ime yes


allow_remote_control yes
listen_on unix:@mykitty

# unmap
map cmd+f no_op
map alt+shift+h no_op
map alt+shift+l no_op
map cmd+shift+w no_op
map cmd+shift+d no_op
map cmd+enter no_op
map cmd+r no_op
map cmd+alt+1 goto_tab 1
map cmd+alt+2 goto_tab 2
map cmd+alt+3 goto_tab 3
map cmd+alt+4 goto_tab 4
map cmd+alt+5 goto_tab 5
map cmd+alt+6 goto_tab 6
map cmd+alt+7 goto_tab 7
map cmd+alt+8 goto_tab 8
map cmd+alt+9 goto_tab 9
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+shift+t new_tab_with_cwd
map shift+cmd+w close_os_window
map ctrl+shift+o next_layout
map ctrl+shift+f show_scrollback
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+shift+z toggle_layout stack
# Create a new window splitting the space used by the existing one so that
# the two windows are placed one above the other
map f5 launch --location=hsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side
map f6 launch --location=vsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side if the existing window is wide or
# one above the other if the existing window is tall.
map f4 launch --location=split

# Rotate the current split, changing its split axis from vertical to
# horizontal or vice versa
map f8 layout_action rotate

# Session management
map f2 save_as_session --use-foreground-process
map f3 goto_session ~/.local/share/kitty/sessions
map f9 new_window_with_cwd
# Move the active window in the indicated direction
map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

# Move the active window to the indicated screen edge
map ctrl+alt+up layout_action move_to_screen_edge top
map ctrl+alt+left layout_action move_to_screen_edge left
map ctrl+alt+right layout_action move_to_screen_edge right
map ctrl+alt+down layout_action move_to_screen_edge bottom

# Switch focus to the neighboring window in the indicated direction
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

# Set the bias of the split containing the currently focused window. The
# currently focused window will take up the specified percent of its parent
# window's size.
map ctrl+. layout_action bias 80

# Maximize the active window along the horizontal axis (fill full width),
# keeping other windows visible in their vertical positions. Press again to
# restore the original layout.
map ctrl+shift+right layout_action maximize horizontal

# Maximize the active window along the vertical axis (fill full height),
# keeping other windows visible in their horizontal positions. Press again
# to restore the original layout.
map ctrl+shift+up layout_action maximize vertical 

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Keep fallback font resolution in fontconfig to avoid IME preedit rendering quirks.
# symbol_map U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+20000-U+2A6DF,U+2A700-U+2B73F,U+2B740-U+2B81F,U+2B820-U+2CEAF,U+2CEB0-U+2EBEF,U+2F800-U+2FA1F HarmonyOS Sans


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# IME preedit text can become effectively invisible with non-block cursors if
# cursor_text_color equals background; override after theme include.
# cursor_text_color #c0caf5
