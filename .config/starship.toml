[os]
disabled = false
style = "bold sapphire"
format = "[$symbol]($style)"

[os.symbols]
NixOS = " "
Windows = " "
Ubuntu = " "
Macos = " "
Linux = " "
Arch = " "

[directory]
style = "bold blue"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[python]
style = "bold lavender"
symbol = " "
format = '[ via ](subtext0)[${symbol}${version}]($style)'
version_format = "v${raw}"

[nix_shell]
symbol = " "
style = "bold sapphire"
format = '[ via ](subtext0)[$symbol$state]($style)'
impure_msg = "(impure)"
pure_msg = "(pure)"

[nodejs]
style = "bold green"
format = '[ via ](subtext0)[${symbol}${version}]($style)'
symbol = " "

[rust]
style = "bold red"
format = '[ via ](subtext0)[${symbol}${version}]($style)'
symbol = " "

[git_branch]
symbol = " "
style = "mauve"
format = '[ on ](subtext0)[$symbol$branch]($style)'

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style))'

[character]
success_symbol = "[╰─:](bold green)"
error_symbol = "[╰─!](bold red)"
vimcmd_symbol = "[╰─ ❮](green)"
