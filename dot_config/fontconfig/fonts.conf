<?xml version='1.0' encoding='UTF-8'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <match target="pattern">
  <test name="family" qual="first">
   <string>sans-serif</string>
  </test>
  <!-- Replace generic family so later system prepend rules won't re-match -->
  <edit binding="strong" mode="assign_replace" name="family">
   <string>HarmonyOS Sans</string>
   <string>Maple Mono NF CN</string>
   <string>LXGW WenKai Mono GB</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="first">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="assign_replace" name="family">
   <string>HarmonyOS Sans</string>
   <string>Maple Mono NF CN</string>
   <string>LXGW WenKai Mono GB</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="first">
   <string>monospace</string>
  </test>
  <edit binding="strong" mode="assign_replace" name="family">
   <string>JetBrainsMono Nerd Font Mono</string>
   <string>HarmonyOS Sans</string>
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="first">
   <string>emoji</string>
  </test>
  <edit binding="strong" mode="assign_replace" name="family">
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <dir>~/.local/share/fonts</dir>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>

 <!-- Keep Ghostty/terminal primary monospace font while preferring HarmonyOS
      Sans SC for CJK fallback when JetBrainsMono Nerd Font Mono lacks glyphs. -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>JetBrainsMono Nerd Font Mono</string>
  </test>
  <edit binding="strong" mode="append" name="family">
   <string>HarmonyOS Sans SC</string>
   <string>Noto Sans CJK SC</string>
   <string>Noto Sans CJK JP</string>
  </edit>
 </match>

 <!-- HarmonyOS Sans SC is proportional by default; mark as monospace so
      terminal fallback logic that requests spacing=100 can select it. -->
 <match target="font">
  <test name="family" qual="any">
   <string>HarmonyOS Sans SC</string>
  </test>
  <edit mode="assign" name="spacing">
   <int>100</int>
  </edit>
 </match>
</fontconfig>
